org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# compileSdk 37 is above the AGP 8.x "tested" range; suppress the
# noisy warning so CI output stays legible. Harmless when actual
# platform-37 jars are present (CI installs via android-actions/setup-android).
android.suppressUnsupportedCompileSdk=37
