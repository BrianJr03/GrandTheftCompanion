name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # ASI — cross-compile the 32-bit Windows DLL on Ubuntu via mingw-w64.
  # Produces ThorBridge.asi with the production flags (CGameProcess
  # hook on, full HUD natives chain, cheat command on). Users who
  # want the safer diagnostic variants build locally with different
  # -D flags.
  # ------------------------------------------------------------------
  asi:
    name: ThorBridge.asi (mingw-w64 i686)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 i686 + cmake
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-mingw-w64-i686 \
            gcc-mingw-w64-i686 \
            cmake \
            ninja-build

      - name: Configure
        working-directory: asi
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-i686.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHORBRIDGE_ENABLE_HOOK=ON \
            -DTHORBRIDGE_NATIVES_LEVEL=4 \
            -DTHORBRIDGE_CHEATS=ON

      - name: Build
        working-directory: asi
        run: cmake --build build --parallel

      - name: Verify PE32 + clean imports
        working-directory: asi/build
        run: |
          file ThorBridge.asi
          echo '--- imported DLLs (should be system-only) ---'
          i686-w64-mingw32-objdump -p ThorBridge.asi | grep 'DLL Name'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThorBridge.asi
          path: asi/build/ThorBridge.asi
          if-no-files-found: error
          retention-days: 90

  # ------------------------------------------------------------------
  # ASI (GTA V) — the 64-bit sibling plugin in asi-v/. Binds Script
  # Hook V at runtime, so nothing third-party is needed to build it.
  # ------------------------------------------------------------------
  asi-v:
    name: ThorBridgeV.asi (mingw-w64 x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 x86_64 + cmake
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            cmake \
            ninja-build

      - name: Configure
        working-directory: asi-v
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-x86_64.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: asi-v
        run: cmake --build build --parallel

      - name: Verify PE32+ + clean imports
        working-directory: asi-v/build
        run: |
          file ThorBridgeV.asi
          file ThorBridgeV.asi | grep -q 'PE32+'
          echo '--- imported DLLs (should be system-only; no ScriptHookV) ---'
          x86_64-w64-mingw32-objdump -p ThorBridgeV.asi | grep 'DLL Name'
          if x86_64-w64-mingw32-objdump -p ThorBridgeV.asi | grep -qi 'DLL Name: ScriptHookV'; then
            echo "::error::ThorBridgeV.asi must not import ScriptHookV.dll statically"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThorBridgeV.asi
          path: asi-v/build/ThorBridgeV.asi
          if-no-files-found: error
          retention-days: 90

  # ------------------------------------------------------------------
  # APK — Android companion. Always builds debug (useful workflow
  # artefact for every main push + PR). On a `v*` tag it ALSO builds a
  # release-signed APK using the keystore secrets, and that signed APK
  # is what the release job attaches to the GitHub Release.
  # ------------------------------------------------------------------
  apk:
    name: GTC.apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # Space-separated single-line — the setup-android action passes
          # `packages` straight to sdkmanager, so a YAML `|` block that
          # inserts a newline between entries fails.
          packages: platforms;android-36 build-tools;35.0.0

      - name: Setup Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Stage debug APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GTC-debug.apk

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTC-debug.apk
          path: dist/GTC-debug.apk
          if-no-files-found: error
          retention-days: 90

      # --- release path (tag-only) ---

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 secret is empty; cannot sign release"
            exit 1
          fi
          # Strip any whitespace (newlines, spaces, tabs) that might
          # have snuck in during upload, then decode. GNU base64 is
          # strict about non-alphabet characters.
          printf '%s' "$KEYSTORE_B64" \
            | tr -d '[:space:]' \
            | base64 -d > "$RUNNER_TEMP/release.jks"
          # Sanity-check: file should be a non-trivial PKCS12/JKS blob.
          sz=$(stat -c '%s' "$RUNNER_TEMP/release.jks")
          echo "decoded keystore size: $sz bytes"
          if [ "$sz" -lt 1024 ]; then
            echo "::error::decoded keystore is suspiciously small ($sz bytes)"
            exit 1
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK (signed)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/build/outputs/apk/release/app-release.apk dist/GTC-release.apk

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: GTC-release.apk
          path: dist/GTC-release.apk
          if-no-files-found: error
          retention-days: 90

  # ------------------------------------------------------------------
  # Release — only on `v*` tags. Attaches both ASIs and the SIGNED
  # release APK to a GitHub Release with auto-generated notes.
  # ------------------------------------------------------------------
  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [asi, asi-v, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pull the per-release notes out of the APK sources first:
      # actions/checkout cleans the workspace by default, so running
      # it after the artifact downloads would wipe dist/ and fail the
      # release step with "Pattern does not match any files". Whatever
      # is in app/src/main/res/raw/patch_notes.md becomes the release
      # body; generate_release_notes appends the auto commit list
      # under it.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app/src/main/res/raw/patch_notes.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: ThorBridge.asi
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: ThorBridgeV.asi
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: GTC-release.apk
          path: dist

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ThorBridge.asi
            dist/ThorBridgeV.asi
            dist/GTC-release.apk
          body_path: app/src/main/res/raw/patch_notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
